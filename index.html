<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E6BFF">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>SpeakMate AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#fff;color:#0F1B3D;font-family:system-ui,sans-serif;max-width:480px;margin:0 auto;min-height:100vh}
.scr{padding:14px;display:flex;flex-direction:column;gap:12px;min-height:100vh}
[hidden]{display:none!important}
.row{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;object-fit:cover;background:#1E6BFF;color:#fff;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center}
.mu{color:#5B6785;font-size:12px}
.hero{background:#E6F0FF;border-radius:14px;padding:12px}
.bot{width:56px;height:56px;border-radius:50%;background:#1E6BFF;color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;flex:none}
.say{background:#fff;border-radius:12px;padding:8px 10px;font-size:14px}
.go{background:#1E6BFF;color:#fff;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:600;text-align:left;width:100%}
.go small{display:block;font-weight:400;font-size:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.t{border:0;border-radius:12px;padding:12px;text-align:left;font-size:14px;font-weight:600;color:#0F1B3D}
.t small{display:block;font-weight:400;color:#5B6785;font-size:12px;margin-top:2px}
.card{background:#F3F7FF;border:.5px solid #DCE6F7;border-radius:12px;padding:12px;font-size:14px}
.bar{height:8px;background:#D6E4FF;border-radius:4px;margin-top:8px}.bar i{display:block;height:8px;background:#1E6BFF;border-radius:4px}
.wr{color:#D32F2F}.ok{color:#1B8A4B;font-weight:600}
.btn{background:#fff;border:1px solid #1E6BFF;color:#1E6BFF;border-radius:8px;padding:8px;font-size:13px;font-weight:600;margin-top:8px}
.top{display:flex;align-items:center;gap:10px;border-bottom:.5px solid #DCE6F7;padding-bottom:10px}
.x{background:none;border:0;font-size:22px;color:#1E6BFF}
#log{flex:1;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.b{max-width:90%;padding:10px 12px;border-radius:14px;background:#F3F7FF;border:.5px solid #DCE6F7;font-size:15px;line-height:1.45}
.u{align-self:flex-end;background:#1E6BFF;color:#fff;border-color:#1E6BFF}
.fx{margin-top:8px;padding:8px;border-radius:10px;background:#FFF1E0;font-size:14px}
.gd{margin-top:8px;padding:8px;border-radius:10px;background:#E5F7EC;font-size:14px}
#in{display:flex;gap:8px;align-items:center;padding-top:8px;border-top:.5px solid #DCE6F7}
#t{flex:1;min-width:0;padding:12px;border:1px solid #DCE6F7;border-radius:12px;font-size:15px;background:#fff;color:#0F1B3D}
.rb{width:50px;height:50px;border-radius:50%;border:0;background:#1E6BFF;color:#fff;font-size:22px;flex:none}
.rb.on{background:#D32F2F}
#st{font-size:12px;color:#5B6785;min-height:16px}
#set{position:fixed;inset:0;background:rgba(15,27,61,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
#set div{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px}
#set input{padding:12px;border:1px solid #DCE6F7;border-radius:10px;font-size:14px}
</style>
</head>
<body>

<div class="scr" id="home">
<div class="row" style="justify-content:space-between">
<div class="row"><img class="logo" src="icon-192.png" alt=""><div><b>SpeakMate <span style="color:#1E6BFF">AI</span></b><div class="mu">Speak · Learn · Grow</div></div></div>
<button class="x" id="gear" aria-label="Settings">⚙</button>
</div>
<img src="hero.jpg" alt="AIRA, your English teacher" style="width:100%;border-radius:14px;display:block">
<button class="go" data-m="speak">▶ Start Practice<small>अभी से अंग्रेज़ी बोलने का अभ्यास शुरू करें</small></button>
<div class="g">
<button class="t" data-m="speak" style="background:#EEEAFE">🎤 Speaking Practice<small>बोलकर सीखें</small></button>
<button class="t" data-m="talk" style="background:#E5F7EC">💬 AI Conversation<small>AI से बात करें</small></button>
<button class="t" data-m="grammar" style="background:#FFF1E0">✏️ Grammar Correction<small>गलती सुधारें</small></button>
<button class="t" id="soon" style="background:#E6F0FF">🔊 Pronunciation Help<small>जल्दी आ रहा है</small></button>
</div>
<div class="card" id="mc"></div>
<div class="card"><div class="row" style="justify-content:space-between"><b>Your Progress</b><span class="mu" id="pt"></span></div><div class="bar"><i id="pb" style="width:0"></i></div></div>
</div>

<div class="scr" id="chat" hidden>
<div class="top"><button class="x" id="back" aria-label="Back">←</button><img class="logo" src="icon-192.png" alt=""><div><b>AIRA</b><div class="mu" id="md"></div></div></div>
<div id="log"></div>
<div id="st"></div>
<div id="in"><button class="rb" id="mic" aria-label="Bolo">🎤</button><input id="t" placeholder="Ya yahan English likho…"><button class="rb" id="send" aria-label="Bhejo">➤</button></div>
</div>

<div id="set" hidden><div>
<b>Groq API key</b>
<span class="mu">Ye key sirf aapke phone mein save hoti hai. Kisi ko mat dikhana.</span>
<input id="kin" type="password" placeholder="gsk_...">
<span class="mu">AIRA ki bolne ki speed (kam = dheere)</span><input id="rt" type="range" min="0.5" max="1.1" step="0.05"><span class="mu">Awaaz chuno</span><select id="vs" style="padding:10px;border:1px solid #DCE6F7;border-radius:10px;font-size:14px;background:#fff;color:#0F1B3D"></select><label class="mu"><input type="checkbox" id="nat"> Natural ladki ki awaaz (Groq) use karo</label><select id="nv" style="padding:10px;border:1px solid #DCE6F7;border-radius:10px;font-size:14px;background:#fff;color:#0F1B3D"><option value="hannah">hannah</option><option value="diana">diana</option><option value="autumn">autumn</option></select><span class="mu" id="nm"></span>
<button class="btn" id="tv" style="margin:0">🔊 Test awaaz</button>
<button class="go" id="ks" style="text-align:center">Save</button>
<button class="btn" id="kc">Cancel</button>
</div></div>

<script>
const $=s=>document.querySelector(s),K='sm_key',MS='sm_mis',PG='sm_prog';
let mode='speak',hist=[],busy=false,voices=[],rec=null;
const MODES={speak:'Speaking Practice',talk:'AI Conversation',grammar:'Grammar Correction'};
const day=()=>new Date().toDateString();
function prog(){try{const p=JSON.parse(localStorage[PG]||'{}');return p.d===day()?p:{d:day(),n:0}}catch(e){return{d:day(),n:0}}}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function loadV(){try{voices=speechSynthesis.getVoices()}catch(e){}}
loadV();try{speechSynthesis.onvoiceschanged=loadV}catch(e){}
function pick(l){
  if(l==='en'){const m=voices.find(v=>v.name===localStorage.sm_voice);if(m)return m}
  const a=voices.filter(v=>v.lang.toLowerCase().replace('_','-').startsWith(l));
  const sc=v=>{const n=v.name.toLowerCase(),g=v.lang.toLowerCase().replace('_','-');let x=0;
    if(/female|woman|girl/.test(n))x+=5;
    if(/\bmale\b/.test(n))x-=9;
    if(/google|neural|natural|wavenet|enhanced|premium/.test(n))x+=3;
    if(g==='en-in')x+=2;
    if(/heera|neerja|zira|samantha|aria|jenny|veena|swara|sonia|libby/.test(n))x+=4;
    if(!v.localService)x+=1;return x};
  return a.slice().sort((p,q)=>sc(q)-sc(p))[0];
}
function speakB(t,l){try{speechSynthesis.cancel();const v=pick(l==='hi'?'hi':'en');(t.match(/[^.!?।]+[.!?।]*/g)||[t]).forEach(x=>{x=x.trim();if(!x)return;const u=new SpeechSynthesisUtterance(x);if(v)u.voice=v;u.lang=l==='hi'?'hi-IN':'en-IN';u.pitch=1.05;u.rate=+(localStorage.sm_rate||.85);speechSynthesis.speak(u)})}catch(e){}}
let au=null,spk=0;
function stopA(){spk++;try{au&&au.pause()}catch(e){}au=null}
async function speakNat(t){
  stopA();const id=spk;
  const parts=(t.match(/[^.!?]+[.!?]*/g)||[t]).map(x=>x.trim()).filter(Boolean);
  const ch=[];let c='';
  for(const p of parts){if((c+' '+p).length>180&&c){ch.push(c);c=p}else c=c?c+' '+p:p}
  if(c)ch.push(c);
  for(const x of ch){
    const r=await fetch('https://api.groq.com/openai/v1/audio/speech',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage[K]},body:JSON.stringify({model:'canopylabs/orpheus-v1-english',voice:localStorage.sm_nv||'hannah',input:x.slice(0,195),response_format:'wav'})});
    if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}throw new Error(r.status+' '+m)}
    const b=await r.blob();if(id!==spk)return;
    await new Promise((res,rej)=>{au=new Audio(URL.createObjectURL(b));au.onended=res;au.onerror=rej;au.play().catch(rej)});
    if(id!==spk)return;
  }
}
function speak(t,l){
  try{speechSynthesis.cancel()}catch(e){}stopA();
  if(l==='en'&&localStorage.sm_nat==='1'&&localStorage[K]){
    speakNat(t).then(()=>{$('#nm').textContent=''}).catch(e=>{$('#nm').textContent='Natural awaaz nahi chali ('+e.message+'). Phone ki awaaz use ho rahi hai.';speakB(t,l)});
  }else speakB(t,l);
}
function home(){
  $('#home').hidden=false;$('#chat').hidden=true;
  let m=null;try{m=JSON.parse(localStorage[MS]||'null')}catch(e){}
  $('#mc').innerHTML=m?'<b>पिछली गलती</b><p class="wr" style="margin:8px 0 2px">✗ '+esc(m.wrong)+'</p><p class="ok" style="margin:0">✓ '+esc(m.correct)+'</p><p class="mu" style="margin:6px 0 0">'+esc(m.hindi)+'</p><button class="btn" id="redo">🎤 फिर से बोलकर देखो</button>':'<b>पिछली गलती</b><p class="mu" style="margin:6px 0 0">अभी तक कोई गलती नहीं। बातचीत शुरू करो!</p>';
  const r=$('#redo');if(r)r.onclick=()=>{go('speak');speak(m.correct,'en');say('Try saying: <b>'+esc(m.correct)+'</b>')};
  const n=prog().n;$('#pt').textContent='आज के सवाल: '+n+'/10';$('#pb').style.width=Math.min(100,n*10)+'%';
}
function bub(cls,h){const d=document.createElement('div');d.className='b '+cls;d.innerHTML=h;$('#log').appendChild(d);d.scrollIntoView({block:'end'});return d}
function say(h){return bub('',h)}
function go(m){
  mode=m;hist=[];$('#log').innerHTML='';$('#home').hidden=true;$('#chat').hidden=false;$('#md').textContent=MODES[m];
  const hi='Hello! I am AIRA. How are you today?';hist.push({role:'assistant',content:hi});
  say(esc(hi)+'<div class="mu" style="margin-top:6px">AIRA: 🎤 दबाकर English बोलो, या नीचे लिखो।</div>');speak(hi,'en');
  if(!localStorage[K])$('#set').hidden=false;
}
async function ask(){
  const sys='You are AIRA, a sweet, warm, encouraging English speaking tutor for a Hindi-speaking beginner. '+(mode==='grammar'?'Be strict about grammar: check every message carefully. ':'Chat naturally about everyday topics. ')+'Reply in SIMPLE English, 1-3 short sentences, and end with a question. Check the student\'s LAST message for grammar or word mistakes (ignore punctuation and capital letters, since text comes from speech). Reply ONLY with JSON: {"reply":"your English reply","mistake":true or false,"wrong":"the wrong sentence","correct":"the corrected sentence","hindi":"short friendly explanation in Hindi (Devanagari) saying where the mistake was and how to fix it"}. If there is no mistake: mistake=false and the other fields empty.';
  const models=['openai/gpt-oss-120b','openai/gpt-oss-20b','llama-3.3-70b-versatile'];let last='';
  for(const m of models){
    for(const jf of [1,0]){
      const body={model:m,temperature:.5,messages:[{role:'system',content:sys}].concat(hist.slice(-10))};
      if(m.startsWith('openai/'))body.reasoning_effort='low';
      if(jf)body.response_format={type:'json_object'};
      const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage[K]},body:JSON.stringify(body)});
      if(r.ok){const c=(await r.json()).choices[0].message.content||'';try{return JSON.parse(c.replace(/```json|```/g,'').trim())}catch(e){return{reply:c,mistake:false}}}
      let msg='';try{msg=(await r.json()).error.message}catch(e){}
      last=r.status+' '+m+': '+msg;
      if(r.status===401)throw new Error('401');
      if(r.status!==400)break;
    }
  }
  throw new Error(last);
}
async function send(text){
  text=(text||'').trim();if(!text||busy)return;
  if(!localStorage[K]){$('#set').hidden=false;return}
  busy=true;$('#t').value='';bub('u',esc(text));hist.push({role:'user',content:text});$('#st').textContent='AIRA सोच रही है…';
  try{
    const j=await ask();hist.push({role:'assistant',content:j.reply});
    let h=esc(j.reply);
    if(j.mistake){h+='<div class="fx">❌ '+esc(j.wrong)+'<br>✅ <b>'+esc(j.correct)+'</b><br>'+esc(j.hindi)+'</div>';localStorage[MS]=JSON.stringify({wrong:j.wrong,correct:j.correct,hindi:j.hindi})}
    else h+='<div class="gd">✅ बिल्कुल सही! शाबाश 👏</div>';
    const d=say(h);
    const b1=document.createElement('button');b1.className='btn';b1.textContent='🔊 AIRA';b1.onclick=()=>speak(j.reply,'en');d.appendChild(b1);
    if(j.mistake&&j.hindi){const b2=document.createElement('button');b2.className='btn';b2.style.marginLeft='6px';b2.textContent='🔊 हिंदी में सुनो';b2.onclick=()=>speak(j.hindi,'hi');d.appendChild(b2)}
    speak(j.reply,'en');
    const p=prog();p.n++;localStorage[PG]=JSON.stringify(p);
  }catch(e){
    say(String(e.message)==='401'?'Key galat lag rahi hai. ⚙ Settings mein dobara dalo.':'Kuch gadbad ho gayi. 🙏<div class="mu" style="margin-top:6px">'+esc(e.message)+'</div>');
  }
  busy=false;$('#st').textContent='';
}
$('#mic').onclick=()=>{
  try{speechSynthesis.cancel()}catch(e){}
  if(rec){rec.stop();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$('#st').textContent='Is browser mein mic nahi chalta. Chrome use karo ya likho.';return}
  rec=new SR();rec.lang='en-IN';rec.interimResults=false;
  rec.onstart=()=>{$('#mic').classList.add('on');$('#st').textContent='सुन रही हूँ… बोलो 🎧'};
  rec.onresult=e=>send(e.results[0][0].transcript);
  rec.onerror=e=>{$('#st').textContent=e.error==='not-allowed'?'Mic ki permission Allow karo.':'Mic nahi chala. Dobara dabao ya likho.'};
  rec.onend=()=>{rec=null;$('#mic').classList.remove('on')};
  try{rec.start()}catch(e){rec=null}
};
$('#send').onclick=()=>send($('#t').value);
$('#t').onkeydown=e=>{if(e.key==='Enter')send($('#t').value)};
$('#back').onclick=()=>{try{speechSynthesis.cancel()}catch(e){}stopA();home()};
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>go(b.dataset.m));
$('#soon').onclick=()=>alert('Pronunciation Help जल्दी आ रहा है!');
function fillSet(){$('#nat').checked=localStorage.sm_nat==='1';$('#nv').value=localStorage.sm_nv||'hannah';$('#nm').textContent='';$('#kin').value='';$('#rt').value=localStorage.sm_rate||.8;const s=$('#vs');s.innerHTML='<option value="">Auto (female)</option>'+voices.filter(v=>v.lang.toLowerCase().startsWith('en')).map(v=>'<option value="'+esc(v.name)+'">'+esc(v.name)+'</option>').join('');s.value=localStorage.sm_voice||''}
$('#gear').onclick=()=>{fillSet();$('#set').hidden=false};
$('#tv').onclick=()=>{localStorage.sm_rate=$('#rt').value;localStorage.sm_voice=$('#vs').value;localStorage.sm_nat=$('#nat').checked?'1':'0';localStorage.sm_nv=$('#nv').value;speak('Hello! I am AIRA. Let us speak English together.','en')};
$('#kc').onclick=()=>{$('#set').hidden=true};
$('#ks').onclick=()=>{const v=$('#kin').value.trim();if(v){localStorage[K]=v}localStorage.sm_rate=$('#rt').value;localStorage.sm_voice=$('#vs').value;localStorage.sm_nat=$('#nat').checked?'1':'0';localStorage.sm_nv=$('#nv').value;$('#set').hidden=true};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
home();
</script>
</body>
</html>
